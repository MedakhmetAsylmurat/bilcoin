}
function statement(id){
 const all=ranked(),s=all.find(x=>x.id==id),inC=all.filter(x=>x.c==s.c),rc=inC.findIndex(x=>x.id==id)+1;
 const tx=S.log.filter(l=>l.i==id).reverse();
 $("acct").innerHTML=`<div class="hd"><div class="mini"><img alt="" src="${LOGO}"></div><div><div class="nm">${esc(s.n)}</div><div class="bal">${s.v.toLocaleString("ru")} BILCOIN</div><small>Класс ${s.c}. Место в лицее: ${s.r} из ${R.length}. В классе: ${rc} из ${inC.length}.</small></div></div><div class="bd"><b>Выписка</b>${tx.length?tx.map(t=>`<div class="tx"><span>${esc(t.r||"Начисление")}<br><small>${new Date(t.t).toLocaleDateString("ru")}</small></span><b class="${t.p>=0?"pos":"neg"}">${t.p>0?"+":""}${t.p}</b></div>`).join(""):`<p style="color:var(--mut)">Начислений пока нет.</p>`}<p style="text-align:right"><button class="btn" onclick="$('mod').classList.remove('on')">Закрыть</button></p></div>`;
 $("mod").classList.add("on");
}

document.addEventListener("click",e=>{
 const t=e.target.closest("[data-p],[data-c],[data-id]");
 if(e.target==$("mod"))$("mod").classList.remove("on");
 if(e.target==$("lg"))$("lg").classList.remove("on");
 if(!t)return;
 if(t.dataset.p){fPar=t.dataset.p=="all"?"all":+t.dataset.p;fCls="all";render()}
 else if(t.dataset.c){fCls=t.dataset.c;render()}
 else if(t.dataset.id)openRow(t.dataset.id);
});
function openRow(id){if(id==SECRET&&!token){secretId=id;$("lm").textContent="";$("lg").classList.add("on");setTimeout(()=>$("lu").focus(),50)}else statement(id)}
document.addEventListener("keydown",e=>{if(e.key=="Enter"&&e.target.dataset&&e.target.dataset.id)openRow(e.target.dataset.id);if(e.key=="Escape"){$("mod").classList.remove("on");$("lg").classList.remove("on")}});
$("seeAcc").onclick=()=>{$("lg").classList.remove("on");statement(secretId)};
$("q").addEventListener("input",e=>{q=e.target.value;render()});
$("aPre").innerHTML=PRESETS.map((p,i)=>`<option value="${i}">${p[0]}${p[1]?" ("+p[1]+")":""}</option>`).join("");
$("aPre").onchange=()=>{const p=PRESETS[$("aPre").value];if(p[1]!==""){$("aPts").value=p[1];$("aWhy").value=p[0]}};
$("dl").innerHTML=R.map(s=>`<option value="${esc(s.n)} (${s.c})">`).join("");
async function api(body){const r=await fetch(API,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)});const d=await r.json().catch(()=>({error:"Ошибка сервера"}));d._s=r.status;return d}
function showAdmin(){const on=!!token;$("bar").style.display=on?"flex":"none";$("adm").style.display=on?"block":"none";$("who").textContent=who}
function logout(){token="";who="";try{sessionStorage.clear()}catch(e){}showAdmin()}
$("out").onclick=logout;
$("lgf").onsubmit=async e=>{e.preventDefault();$("lm").textContent="Проверяю…";
 const d=await api({action:"login",user:$("lu").value.trim(),pass:$("lp").value});
 if(d.token){token=d.token;who=d.user;try{sessionStorage.setItem("bt",token);sessionStorage.setItem("bw",who)}catch(e){}$("lp").value="";$("lg").classList.remove("on");showAdmin()}
 else $("lm").textContent=d.error||"Не удалось войти"};
$("aGo").onclick=async()=>{
 const m=$("aMsg"),v=$("aName").value.trim(),p=parseInt($("aPts").value);
 const s=R.find(x=>`${x.n} (${x.c})`==v)||R.find(x=>norm(x.n)==norm(v));
 if(!s||!p){m.textContent="Выберите ученика из списка и введите баллы";return}
 m.textContent="Сохраняю…";
 const d=await api({action:"award",token,id:s.id,p,r:$("aWhy").value.trim()});
 if(d.pts){S=d;render();m.textContent=`Готово: ${s.n}, ${p>0?"+":""}${p}`;$("aPts").value="";$("aWhy").value="";$("aName").value=""}
 else{m.textContent=d.error||"Не удалось сохранить";if(d._s==401)logout()}
};
async function load(){try{const r=await fetch(API,{cache:"no-store"});if(r.ok){const d=await r.json();if(d&&d.pts){S=d;render()}}}catch(e){}}
render();showAdmin();load();setInterval(load,30000);
</script></body></html>
